<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="译点 · 实时双向翻译工具">
  <title>译点 · 实时双向翻译</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
      background: #f4f6f9;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .container {
      width: 100%; max-width: 1000px; background: #fff;
      border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      padding: 24px 28px 28px;
    }

    /* ---------- 品牌区 ---------- */
    .brand {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; margin-bottom: 4px;
    }
    .brand-mark {
      width: 24px; height: 24px;
      border-radius: 7px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 0.78rem;
      box-shadow: 0 3px 8px rgba(99, 102, 241, 0.32);
      flex-shrink: 0;
    }
    h1 {
      font-size: 1.35rem; font-weight: 600; color: #1e293b;
      letter-spacing: 2px;
    }
    .subtitle {
      text-align: center; color: #94a3b8; font-size: 0.78rem;
      margin-bottom: 18px; letter-spacing: 0.3px;
    }
    .subtitle .sep { margin: 0 6px; color: #cbd5e1; }

    /* ---------- 统一图标 ---------- */
    .icon {
      width: 14px; height: 14px;
      display: block;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    /* ---------- 工具栏 ---------- */
    .toolbar {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 12px; flex-wrap: wrap;
      position: relative; z-index: 100;
    }
    .toolbar-label { font-size: 0.75rem; color: #64748b; font-weight: 500; }
    .toolbar .spacer { flex: 1; min-width: 4px; }
    .toolbar button {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      font-size: 0.72rem; padding: 5px 10px;
      border: 1px solid #e2e8f0; border-radius: 6px;
      background: #fafbfc; color: #475569; cursor: pointer;
      transition: all 0.15s; font-family: inherit;
      min-height: 28px;
    }
    .toolbar button:hover { background: #f1f5f9; border-color: #cbd5e1; color: #6366f1; }
    .toolbar button:active { background: #eef2ff; transform: translateY(1px); }
    .toolbar button.swap-btn { padding: 4px 8px; color: #6366f1; }
    .toolbar button.swap-btn .icon { width: 16px; height: 16px; }

    /* ---------- 自定义下拉框 ---------- */
    .custom-select-wrapper { position: relative; user-select: none; font-size: 0.75rem; }
    .custom-select-trigger {
      display: flex; align-items: center; justify-content: space-between;
      gap: 6px; padding: 5px 10px;
      border: 1px solid #e2e8f0; border-radius: 6px;
      background: #fafbfc; color: #334155; cursor: pointer;
      min-width: 76px; min-height: 28px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .custom-select-trigger:hover { border-color: #cbd5e1; }
    .custom-select-wrapper.open .custom-select-trigger {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
      background: #fff;
    }
    .custom-select-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .custom-select-arrow {
      width: 10px; height: 10px; fill: #94a3b8; flex-shrink: 0;
      transition: transform 0.2s, fill 0.15s;
    }
    .custom-select-wrapper.open .custom-select-arrow { transform: rotate(180deg); fill: #6366f1; }
    .custom-select-options {
      position: absolute; top: 100%; left: 0; min-width: 100%; margin-top: 4px;
      background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
      z-index: 1000; display: none; max-height: 240px; overflow-y: auto;
      opacity: 0; transform: translateY(-4px);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .custom-select-wrapper.open .custom-select-options {
      display: block; opacity: 1; transform: translateY(0);
    }
    .custom-option {
      padding: 8px 12px; cursor: pointer; color: #334155;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: background 0.1s;
    }
    .custom-option:hover { background: #f1f5f9; }
    .custom-option.selected { background: #eef2ff; color: #6366f1; font-weight: 500; }
    .custom-select-options::-webkit-scrollbar { width: 6px; }
    .custom-select-options::-webkit-scrollbar-track { background: transparent; }
    .custom-select-options::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .custom-select-options::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* ---------- 翻译区 ---------- */
    .translator-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .panel { display: flex; flex-direction: column; gap: 6px; }
    .panel-header { display: flex; align-items: center; justify-content: space-between; }
    .panel-label {
      font-size: 0.72rem; font-weight: 500; color: #64748b;
      text-transform: uppercase; letter-spacing: 0.4px; padding-left: 2px;
    }
    .panel-actions { display: flex; gap: 4px; }
    .panel-actions button {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; padding: 0;
      border: 1px solid #e2e8f0; border-radius: 5px;
      background: #fafbfc; color: #94a3b8; cursor: pointer;
      transition: all 0.15s; font-family: inherit;
    }
    .panel-actions button .icon { width: 12px; height: 12px; }
    .panel-actions button:hover { background: #eef2ff; border-color: #a5b4fc; color: #6366f1; }
    .panel-actions button:active { transform: translateY(1px); }

    textarea {
      width: 100%; min-height: 200px; padding: 12px 14px;
      border: 1.5px solid #e2e8f0; border-radius: 10px;
      font-size: 0.95rem; line-height: 1.65; font-family: inherit;
      resize: none; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fafbfc;
    }
    textarea:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.1); background: #fff; }
    textarea::placeholder { color: #b0bec5; }
    #rightText { background: #f8fafc; color: #334155; }
    #rightText:focus { background: #fff; }

    /* ---------- 状态栏 ---------- */
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 12px; font-size: 0.75rem; color: #94a3b8;
      min-height: 22px; flex-wrap: wrap; gap: 8px;
    }
    .status-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .status-indicator { display: flex; align-items: center; gap: 5px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
    .dot.busy { background: #f59e0b; animation: pulse 0.8s ease-in-out infinite; }
    .dot.error { background: #ef4444; }
    .dot.idle { background: #cbd5e1; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    .engine-badge {
      font-size: 0.68rem; padding: 2px 8px; border-radius: 10px;
      background: #eef2ff; color: #6366f1; font-weight: 500; white-space: nowrap;
    }
    .engine-badge.mymemory { background: #fef3c7; color: #b45309; }
    .engine-badge.fail { background: #fef2f2; color: #ef4444; }
    .engine-badge.idle { background: #f1f5f9; color: #64748b; }

    .char-count { font-variant-numeric: tabular-nums; }
    .char-count.warn { color: #ef4444; font-weight: 500; }

    .footer-note { margin-top: 16px; font-size: 0.68rem; color: #cbd5e1; text-align: center; line-height: 1.5; }

    /* ---------- 移动端适配 ---------- */
    @media (max-width: 700px) {
      body {
        justify-content: flex-start;
        padding: 12px;
        padding-top: max(12px, env(safe-area-inset-top));
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }
      .container { padding: 16px 14px 18px; border-radius: 14px; }
      .brand-mark { width: 22px; height: 22px; font-size: 0.72rem; border-radius: 6px; }
      h1 { font-size: 1.18rem; letter-spacing: 1.5px; }
      .subtitle { font-size: 0.72rem; margin-bottom: 14px; }

      .toolbar { gap: 6px; margin-bottom: 10px; }
      .toolbar-label { display: none; }
      .toolbar button { padding: 5px 9px; font-size: 0.7rem; min-height: 30px; }

      .custom-select-trigger { padding: 5px 9px; font-size: 0.72rem; min-width: 68px; min-height: 30px; }

      .translator-pair { grid-template-columns: 1fr; gap: 10px; }
      textarea { min-height: 130px; font-size: 0.92rem; padding: 10px 12px; line-height: 1.55; }

      .panel-label { font-size: 0.68rem; }
      .panel-actions button { width: 26px; height: 26px; }
      .panel-actions button .icon { width: 13px; height: 13px; }

      .status-bar { font-size: 0.7rem; margin-top: 10px; }
      .engine-badge { font-size: 0.64rem; padding: 1px 6px; }
      .footer-note { font-size: 0.65rem; margin-top: 12px; }

      .custom-select-options { max-height: 200px; }
      .custom-option { padding: 10px 12px; font-size: 0.75rem; }
    }

    @media (max-width: 400px) {
      .toolbar .spacer { display: none; }
      .toolbar > button { padding: 5px 7px; }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- 品牌区：译点为主标题，"实时双向翻译"作副标题 -->
    <div class="brand">
      <span class="brand-mark">译</span>
      <h1>译点</h1>
    </div>
    <p class="subtitle">实时双向翻译<span class="sep">·</span>输入即译<span class="sep">·</span>多语言互译</p>

    <!-- 工具栏 -->
    <div class="toolbar">
      <!-- 源语言 -->
      <div class="custom-select-wrapper" id="sourceLangWrapper">
        <select id="sourceLang" style="display: none;">
          <option value="auto">自动检测</option>
          <option value="zh-Hans">中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="ru">Русский</option>
        </select>
        <div class="custom-select-trigger">
          <span class="custom-select-label">自动检测</span>
          <svg class="custom-select-arrow" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
        </div>
        <div class="custom-select-options"></div>
      </div>

      <!-- 交换 -->
      <button class="swap-btn" id="btnSwapLang" title="交换语言" aria-label="交换语言">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M7 16l-4-4 4-4"/>
          <path d="M3 12h18"/>
          <path d="M17 8l4 4-4 4"/>
        </svg>
      </button>

      <!-- 目标语言 -->
      <div class="custom-select-wrapper" id="targetLangWrapper">
        <select id="targetLang" style="display: none;">
          <option value="zh-Hans">中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="ru">Русский</option>
        </select>
        <div class="custom-select-trigger">
          <span class="custom-select-label">中文</span>
          <svg class="custom-select-arrow" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
        </div>
        <div class="custom-select-options"></div>
      </div>

      <span class="toolbar-label">引擎：</span>

      <!-- 引擎 -->
      <div class="custom-select-wrapper" id="engineWrapper">
        <select id="engineSelect" style="display: none;">
          <option value="auto">自动</option>
          <option value="bing">Bing</option>
          <option value="mymemory">MyMemory</option>
        </select>
        <div class="custom-select-trigger">
          <span class="custom-select-label">自动</span>
          <svg class="custom-select-arrow" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
        </div>
        <div class="custom-select-options"></div>
      </div>

      <div class="spacer"></div>

      <button id="btnSpeakLeft" title="朗读左侧文本" aria-label="朗读左侧文本">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M11 5L6 9H2v6h4l5 4V5z"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
        <span>左</span>
      </button>
      <button id="btnSpeakRight" title="朗读右侧文本" aria-label="朗读右侧文本">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M11 5L6 9H2v6h4l5 4V5z"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
        <span>右</span>
      </button>
    </div>

    <section class="translator-pair">
      <div class="panel">
        <div class="panel-header">
          <span class="panel-label" id="leftLabel">源语言</span>
          <div class="panel-actions">
            <button class="btn-copy" data-target="leftText" title="复制" aria-label="复制左侧">
              <svg class="icon" viewBox="0 0 24 24">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
            </button>
            <button class="btn-clear" data-target="leftText" title="清空" aria-label="清空左侧">
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M18 6L6 18"/>
                <path d="M6 6l12 12"/>
              </svg>
            </button>
          </div>
        </div>
        <textarea id="leftText" placeholder="Type here..." spellcheck="false" aria-label="左侧输入框"></textarea>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span class="panel-label" id="rightLabel">目标语言</span>
          <div class="panel-actions">
            <button class="btn-copy" data-target="rightText" title="复制" aria-label="复制右侧">
              <svg class="icon" viewBox="0 0 24 24">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
            </button>
            <button class="btn-clear" data-target="rightText" title="清空" aria-label="清空右侧">
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M18 6L6 18"/>
                <path d="M6 6l12 12"/>
              </svg>
            </button>
          </div>
        </div>
        <textarea id="rightText" placeholder="在这里输入..." spellcheck="false" aria-label="右侧输入框"></textarea>
      </div>
    </section>

    <div class="status-bar">
      <div class="status-left">
        <div class="status-indicator">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">就绪</span>
        </div>
        <span class="engine-badge" id="engineBadge">待翻译</span>
      </div>
      <span class="char-count" id="charCount">0 / 2000 字符</span>
    </div>

    <p class="footer-note">
      快捷键：Ctrl+Enter 翻译 · Ctrl+Shift+S 朗读目标文本
    </p>
  </div>

  <script>
    (function() {
      'use strict';

      var leftText = document.getElementById('leftText');
      var rightText = document.getElementById('rightText');
      var statusDot = document.getElementById('statusDot');
      var statusText = document.getElementById('statusText');
      var charCount = document.getElementById('charCount');
      var engineBadge = document.getElementById('engineBadge');
      var sourceLangSelect = document.getElementById('sourceLang');
      var targetLangSelect = document.getElementById('targetLang');
      var engineSelect = document.getElementById('engineSelect');
      var leftLabel = document.getElementById('leftLabel');
      var rightLabel = document.getElementById('rightLabel');

      var MAX_CHARS = 2000;
      var DEBOUNCE_MS = 400;
      var MIN_TRIGGER = 1;

      var debounceTimer = null;
      var currentRequestId = 0;
      var isComposing = false;
      var currentEngine = 'auto';
      var lastFocusedEl = leftText;

      // ---------- 自定义下拉框 ----------
      function initCustomSelect(wrapperId) {
        var wrapper = document.getElementById(wrapperId);
        var select = wrapper.querySelector('select');
        var trigger = wrapper.querySelector('.custom-select-trigger');
        var label = trigger.querySelector('.custom-select-label');
        var optionsContainer = wrapper.querySelector('.custom-select-options');

        var html = '';
        for (var i = 0; i < select.options.length; i++) {
          var opt = select.options[i];
          html += '<div class="custom-option" data-value="' + opt.value + '">' + opt.text + '</div>';
        }
        optionsContainer.innerHTML = html;
        var options = optionsContainer.querySelectorAll('.custom-option');

        function updateUI() {
          var val = select.value;
          var selectedOpt = select.options[select.selectedIndex];
          label.textContent = selectedOpt.text;
          options.forEach(function(o) {
            o.classList.toggle('selected', o.dataset.value === val);
          });
        }
        updateUI();

        trigger.addEventListener('click', function(e) {
          e.stopPropagation();
          var isOpen = wrapper.classList.contains('open');
          document.querySelectorAll('.custom-select-wrapper.open').forEach(function(w) {
            if (w !== wrapper) w.classList.remove('open');
          });
          wrapper.classList.toggle('open', !isOpen);
        });

        options.forEach(function(opt) {
          opt.addEventListener('click', function(e) {
            e.stopPropagation();
            select.value = this.dataset.value;
            select.dispatchEvent(new Event('change'));
            updateUI();
            wrapper.classList.remove('open');
          });
        });

        select.addEventListener('change', updateUI);
      }

      initCustomSelect('sourceLangWrapper');
      initCustomSelect('targetLangWrapper');
      initCustomSelect('engineWrapper');

      document.addEventListener('click', function() {
        document.querySelectorAll('.custom-select-wrapper.open').forEach(function(w) {
          w.classList.remove('open');
        });
      });

      leftText.addEventListener('focus', function() { lastFocusedEl = leftText; });
      rightText.addEventListener('focus', function() { lastFocusedEl = rightText; });

      // ---------- 工具函数 ----------
      function debounce(fn, delay) {
        return function() {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(fn, delay);
        };
      }

      function setStatus(state, message) {
        statusDot.className = 'dot';
        if (state === 'busy') { statusDot.classList.add('busy'); statusText.textContent = message || '翻译中…'; }
        else if (state === 'error') { statusDot.classList.add('error'); statusText.textContent = message || '请求失败'; }
        else if (state === 'idle') { statusDot.classList.add('idle'); statusText.textContent = message || '就绪'; }
        else { statusText.textContent = message || '就绪'; }
      }

      function setEngineBadge(name) {
        engineBadge.textContent = name;
        engineBadge.className = 'engine-badge';
        if (name === 'MyMemory') engineBadge.classList.add('mymemory');
        if (name === '失败' || name === '错误') engineBadge.classList.add('fail');
        if (name === '直译') engineBadge.classList.add('idle');
      }

      function updateCharCount() {
        var len = Math.max(leftText.value.length, rightText.value.length);
        charCount.textContent = len + ' / ' + MAX_CHARS + ' 字符';
        charCount.classList.toggle('warn', len > MAX_CHARS);
      }

      function containsChinese(text) {
        return /[\u4e00-\u9fff\u3400-\u4dbf]/.test(text);
      }

      function detectLang(text) {
        if (/[\u3040-\u309f\u30a0-\u30ff]/.test(text)) return 'ja';
        if (/[\uac00-\ud7af]/.test(text)) return 'ko';
        if (/[\u4e00-\u9fff\u3400-\u4dbf]/.test(text)) return 'zh-Hans';
        return 'en';
      }

      function updateLanguageLabels() {
        var src = sourceLangSelect.value;
        var tgt = targetLangSelect.value;
        var srcName = sourceLangSelect.options[sourceLangSelect.selectedIndex].text;
        var tgtName = targetLangSelect.options[targetLangSelect.selectedIndex].text;
        leftLabel.textContent = src === 'auto' ? '自动检测' : srcName;
        rightLabel.textContent = tgtName;
      }

      // ---------- 引擎 1: Bing Translate ----------
      async function translateBing(text, from, to) {
        var src = from === 'auto' ? 'auto' : (from.startsWith('zh') ? 'zh-Hans' : from);
        var tgt = to.startsWith('zh') ? 'zh-Hans' : to;

        var url = 'https://edge.microsoft.com/translate/translatetext' +
          '?from=' + encodeURIComponent(src) +
          '&to=' + encodeURIComponent(tgt) +
          '&isEnterpriseClient=false';

        var response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify([text])
        });

        if (!response.ok) throw new Error('Bing HTTP ' + response.status);

        var data = await response.json();
        if (Array.isArray(data) && data[0] && data[0].translations && data[0].translations[0]) {
          return data[0].translations[0].text;
        }
        throw new Error('Bing 翻译结果为空');
      }

      // ---------- 引擎 2: MyMemory ----------
      async function translateMyMemory(text, from, to) {
        var src = from === 'auto' ? (detectLang(text).startsWith('zh') ? 'zh-CN' : detectLang(text))
                                   : (from.startsWith('zh') ? 'zh-CN' : from);
        var tgt = to.startsWith('zh') ? 'zh-CN' : to;
        var params = new URLSearchParams({
          q: text,
          langpair: src + '|' + tgt,
          de: 'translator@example.com'
        });
        var url = 'https://api.mymemory.translated.net/get?' + params.toString();

        var response = await fetch(url);
        if (!response.ok) throw new Error('MyMemory HTTP ' + response.status);
        var data = await response.json();
        if (data.responseStatus !== 200) throw new Error(data.responseDetails || 'MyMemory 错误');
        var translated = data.responseData && data.responseData.translatedText;
        if (!translated || typeof translated !== 'string') throw new Error('MyMemory 结果格式异常');
        if (translated.toUpperCase().indexOf('MYMEMORY WARNING') !== -1) throw new Error('MyMemory 额度已用尽');
        return translated;
      }

      var ENGINES = {
        bing: { name: 'Bing Translate', fn: translateBing },
        mymemory: { name: 'MyMemory', fn: translateMyMemory }
      };

      async function translateWithFallback(text, from, to) {
        var order = currentEngine === 'auto' ? ['bing', 'mymemory'] : [currentEngine];
        var lastError = null;
        for (var i = 0; i < order.length; i++) {
          var key = order[i];
          try {
            var result = await ENGINES[key].fn(text, from, to);
            setEngineBadge(ENGINES[key].name);
            return result;
          } catch (e) {
            console.warn('[翻译引擎失败]', key, e.message);
            lastError = e;
            if (currentEngine !== 'auto') break;
          }
        }
        throw lastError || new Error('所有翻译引擎均不可用');
      }

      // ---------- 核心翻译 ----------
      async function performTranslation(sourceEl, targetEl) {
        var raw = sourceEl.value.trim();
        if (raw.length < MIN_TRIGGER) {
          targetEl.value = '';
          setStatus('idle', '就绪');
          updateCharCount();
          return;
        }

        var text = raw.slice(0, MAX_CHARS);
        var uiSourceLang = sourceLangSelect.value;
        var uiTargetLang = targetLangSelect.value;

        var effectiveSourceLang = uiSourceLang;
        if (uiSourceLang === 'auto') {
          effectiveSourceLang = detectLang(text);
        }

        if (effectiveSourceLang.startsWith(uiTargetLang.split('-')[0])) {
          targetEl.value = text;
          setStatus('ready', '就绪');
          setEngineBadge('直译');
          updateCharCount();
          return;
        }

        var requestId = ++currentRequestId;
        setStatus('busy');
        engineBadge.textContent = '…';

        try {
          var result = await translateWithFallback(text, uiSourceLang, uiTargetLang);
          if (requestId !== currentRequestId) return;
          targetEl.value = result;
          setStatus('ready', '就绪');
        } catch (err) {
          if (requestId !== currentRequestId) return;
          console.error('Translation error:', err);
          setStatus('error', err.message || '翻译失败');
          setEngineBadge('失败');
        } finally {
          if (requestId === currentRequestId) updateCharCount();
        }
      }

      // ---------- TTS ----------
      function charLang(ch, hasKana) {
        var code = ch.charCodeAt(0);
        if (code >= 0x3040 && code <= 0x30ff) return 'ja';
        if (code >= 0xac00 && code <= 0xd7af) return 'ko';
        if (code >= 0x4e00 && code <= 0x9fff) return hasKana ? 'ja' : 'zh';
        if ((code >= 0x41 && code <= 0x5a) || (code >= 0x61 && code <= 0x7a)) return 'en';
        return 'neutral';
      }

      function segmentText(text) {
        var hasKana = /[\u3040-\u309f\u30a0-\u30ff]/.test(text);
        var segments = [];
        var currentLang = null;
        var currentText = '';

        for (var i = 0; i < text.length; i++) {
          var ch = text[i];
          var lang = charLang(ch, hasKana);
          if (lang === 'neutral') {
            currentText += ch;
          } else if (lang === currentLang) {
            currentText += ch;
          } else {
            if (currentText && currentLang) segments.push({ text: currentText, lang: currentLang });
            currentText = ch;
            currentLang = lang;
          }
        }
        if (currentText) segments.push({ text: currentText, lang: currentLang || 'en' });

        var merged = [];
        segments.forEach(function(seg) {
          var last = merged[merged.length - 1];
          if (last && last.text.length < 3) last.text += seg.text;
          else merged.push({ text: seg.text, lang: seg.lang });
        });
        return merged;
      }

      function pickVoice(langPrefix) {
        var voices = window.speechSynthesis.getVoices();
        return voices.find(function(x) { return x.lang.toLowerCase().startsWith(langPrefix); }) || null;
      }

      function speakText(text, forcedLang) {
        if (!text.trim() || !window.speechSynthesis) return;
        window.speechSynthesis.cancel();

        if (forcedLang && forcedLang !== 'auto') {
          var langCode = forcedLang;
          if (langCode.startsWith('zh')) langCode = 'zh-CN';
          else if (langCode.startsWith('en')) langCode = 'en-US';
          else if (langCode.startsWith('ja')) langCode = 'ja-JP';
          else if (langCode.startsWith('ko')) langCode = 'ko-KR';
          var u = new SpeechSynthesisUtterance(text);
          u.lang = langCode;
          u.rate = 0.9;
          u.volume = 1;
          var v = pickVoice(langCode.split('-')[0]);
          if (v) u.voice = v;
          window.speechSynthesis.speak(u);
          return;
        }

        var segments = segmentText(text);
        if (!segments.length) return;
        segments.forEach(function(seg) {
          if (!seg.text.trim()) return;
          var u = new SpeechSynthesisUtterance(seg.text);
          if (seg.lang === 'zh') u.lang = 'zh-CN';
          else if (seg.lang === 'ja') u.lang = 'ja-JP';
          else if (seg.lang === 'ko') u.lang = 'ko-KR';
          else u.lang = 'en-US';
          u.rate = 0.9;
          u.volume = 1;
          var v = pickVoice(seg.lang);
          if (v) u.voice = v;
          window.speechSynthesis.speak(u);
        });
      }

      // ---------- 复制 / 清空 ----------
      function copyText(id) {
        var el = document.getElementById(id);
        if (!el.value) return;
        navigator.clipboard.writeText(el.value).then(function() {
          setStatus('ready', '已复制');
          setTimeout(function() { setStatus('ready', '就绪'); }, 1200);
        }).catch(function() {
          el.select(); document.execCommand('copy');
          setStatus('ready', '已复制');
          setTimeout(function() { setStatus('ready', '就绪'); }, 1200);
        });
      }

      function clearText(id) {
        document.getElementById(id).value = '';
        updateCharCount();
        setStatus('ready', '已清空');
        setTimeout(function() { setStatus('ready', '就绪'); }, 800);
      }

      // ---------- 输入处理 ----------
      function createInputHandler(sourceEl, targetEl) {
        var debounced = debounce(function() { performTranslation(sourceEl, targetEl); }, DEBOUNCE_MS);
        return function() {
          updateCharCount();
          if (isComposing) return;
          debounced();
        };
      }

      var handleLeftInput = createInputHandler(leftText, rightText);
      var handleRightInput = createInputHandler(rightText, leftText);

      leftText.addEventListener('input', handleLeftInput);
      rightText.addEventListener('input', handleRightInput);

      [leftText, rightText].forEach(function(el) {
        el.addEventListener('compositionstart', function() { isComposing = true; });
        el.addEventListener('compositionend', function() {
          isComposing = false;
          if (el === leftText) handleLeftInput(); else handleRightInput();
        });
      });

      sourceLangSelect.addEventListener('change', function() {
        updateLanguageLabels();
        if (lastFocusedEl === leftText) performTranslation(leftText, rightText);
        else if (lastFocusedEl === rightText) performTranslation(rightText, leftText);
      });

      targetLangSelect.addEventListener('change', function() {
        updateLanguageLabels();
        if (lastFocusedEl === leftText) performTranslation(leftText, rightText);
        else if (lastFocusedEl === rightText) performTranslation(rightText, leftText);
      });

      engineSelect.addEventListener('change', function() {
        currentEngine = this.value;
        setStatus('ready', '引擎已切换');
        setTimeout(function() { setStatus('ready', '就绪'); }, 1000);
      });

      document.getElementById('btnSwapLang').addEventListener('click', function() {
        var src = sourceLangSelect.value;
        var tgt = targetLangSelect.value;
        if (src === 'auto') {
          sourceLangSelect.value = tgt;
          targetLangSelect.value = tgt === 'zh-Hans' ? 'en' : 'zh-Hans';
        } else {
          sourceLangSelect.value = tgt;
          targetLangSelect.value = src;
        }
        sourceLangSelect.dispatchEvent(new Event('change'));
        targetLangSelect.dispatchEvent(new Event('change'));
      });

      document.querySelectorAll('.btn-copy').forEach(function(btn) {
        btn.addEventListener('click', function() { copyText(btn.dataset.target); });
      });
      document.querySelectorAll('.btn-clear').forEach(function(btn) {
        btn.addEventListener('click', function() { clearText(btn.dataset.target); });
      });

      document.getElementById('btnSpeakLeft').addEventListener('click', function() {
        if (leftText.value) speakText(leftText.value, sourceLangSelect.value);
      });
      document.getElementById('btnSpeakRight').addEventListener('click', function() {
        if (rightText.value) speakText(rightText.value, targetLangSelect.value);
      });

      document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === 'Enter') {
          e.preventDefault();
          var active = document.activeElement;
          if (active === leftText) performTranslation(leftText, rightText);
          else if (active === rightText) performTranslation(rightText, leftText);
        }
        if (e.ctrlKey && e.shiftKey && (e.key === 'S' || e.key === 's')) {
          e.preventDefault();
          var active = document.activeElement;
          if (active === leftText && rightText.value) speakText(rightText.value, targetLangSelect.value);
          else if (active === rightText && leftText.value) speakText(leftText.value, sourceLangSelect.value);
        }
      });

      updateCharCount();
      updateLanguageLabels();
      leftText.focus();
      setEngineBadge('待翻译');

      if (window.speechSynthesis) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = function() {};
      }

    })();
  </script>
</body>
</html>
